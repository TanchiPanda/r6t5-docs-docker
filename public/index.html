<!DOCTYPE html>
<!-- R6T5-DOCS-COMMUNITY-TEMPLATE-V1 | 本模板受《r6t5-docs 社区版授权条款》约束，署名与下方检测标记不得删除 -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="r6t5-docs-template" content="community-v1">
  <meta name="r6t5-docs-attribution" content="required">
  <title>r6t5 文档</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #ffffff;
      --sidebar-bg: #f7f8fa;
      --border: #e5e7eb;
      --text: #1f2328;
      --text-muted: #656d76;
      --accent: #0969da;
      --code-bg: #f6f8fa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.7;
    }
    .layout { display: flex; min-height: 100vh; }

    /* ---------- 侧边栏 ---------- */
    .sidebar {
      width: 280px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      padding: 16px 0;
      flex-shrink: 0;
    }
    .sidebar .brand {
      font-weight: 700;
      font-size: 16px;
      padding: 0 20px 12px;
    }
    .sidebar ul { list-style: none; margin: 0; padding: 0; }
    details.group { margin: 2px 0; }
    details.group > summary {
      cursor: pointer;
      padding: 8px 20px;
      font-weight: 600;
      font-size: 14px;
      list-style: none;
      display: flex;
      align-items: center;
      gap: 6px;
      user-select: none;
    }
    details.group > summary::before {
      content: "▸";
      color: var(--text-muted);
      transition: transform .15s;
      font-size: 12px;
    }
    details.group[open] > summary::before { transform: rotate(90deg); }
    details.group > summary:hover { background: #eceef1; }
    .node-link {
      display: block;
      padding: 7px 20px 7px 36px;
      font-size: 14px;
      color: var(--text);
      text-decoration: none;
    }
    .node-link:hover { background: #eceef1; }
    .node-link.active {
      color: var(--accent);
      background: #ddf4ff;
      font-weight: 600;
    }

    /* ---------- 主区域 ---------- */
    .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 12px;
      padding: 12px 28px;
      border-bottom: 1px solid var(--border);
    }
    .topbar .doc-title { flex: 1; font-size: 15px; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .edit-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      text-decoration: none;
      font-size: 13px;
      background: #fff;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .edit-btn:hover { background: var(--code-bg); border-color: #d0d7de; }

    /* ---------- 复制全文下拉 ---------- */
    .copy-group { position: relative; flex-shrink: 0; }
    .search-wrap { position: relative; flex-shrink: 0; }
    .search-input {
      width: 240px; padding: 6px 46px 6px 12px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--bg); color: var(--text);
      font-size: 13px; outline: none;
    }
    .search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(9,105,218,.12); }
    .search-kbd {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      font-size: 11px; color: var(--text-muted); border: 1px solid var(--border);
      border-radius: 4px; padding: 0 4px; pointer-events: none;
    }
    .search-results {
      position: absolute; top: 36px; left: 0; width: 420px; max-height: 60vh; overflow: auto;
      background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
      box-shadow: 0 12px 32px rgba(0,0,0,.18); z-index: 60;
    }
    .search-item { padding: 8px 12px; cursor: pointer; border-bottom: 1px solid var(--border); }
    .search-item:last-child { border-bottom: none; }
    .search-item.active, .search-item:hover { background: rgba(9,105,218,.08); }
    .search-item .st { font-size: 13px; font-weight: 600; }
    .search-item .sp { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .search-item .ss { font-size: 12px; color: var(--text-muted); margin-top: 4px; line-height: 1.5; }
    .search-empty { padding: 12px; font-size: 12px; color: var(--text-muted); }
    .copy-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      background: #fff;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }
    .copy-btn:hover { background: var(--code-bg); }
    .copy-btn .caret { font-size: 10px; color: var(--text-muted); }
    .copy-menu {
      position: absolute;
      right: 0;
      top: calc(100% + 6px);
      min-width: 150px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,.12);
      padding: 6px;
      z-index: 30;
    }
    .copy-menu[hidden] { display: none; }
    .copy-menu button {
      display: block;
      width: 100%;
      text-align: left;
      padding: 8px 12px;
      border: none;
      background: none;
      font-size: 13px;
      border-radius: 6px;
      cursor: pointer;
      color: var(--text);
    }
    .copy-menu button:hover { background: var(--code-bg); }
    .copy-menu .menu-desc { color: var(--text-muted); font-size: 12px; }
    .content {
      padding: 28px;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
    }

    /* ---------- Markdown 渲染样式 ---------- */
    .content h1, .content h2, .content h3, .content h4 { line-height: 1.3; margin-top: 1.6em; }
    .content h1 { font-size: 1.9em; border-bottom: 1px solid var(--border); padding-bottom: .3em; }
    .content h2 { font-size: 1.45em; border-bottom: 1px solid var(--border); padding-bottom: .3em; }
    .content h3 { font-size: 1.2em; }
    .content code {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      background: var(--code-bg);
      padding: 2px 6px;
      border-radius: 5px;
      font-size: 85%;
    }
    .content pre {
      background: var(--code-bg);
      padding: 14px 16px;
      border-radius: 8px;
      overflow-x: auto;
    }
    .content pre code { background: none; padding: 0; }
    .content blockquote {
      margin: 1em 0;
      padding: 2px 16px;
      border-left: 4px solid var(--border);
      color: var(--text-muted);
      background: var(--code-bg);
      border-radius: 0 8px 8px 0;
    }
    .content table { border-collapse: collapse; width: 100%; margin: 1em 0; }
    .content th, .content td { border: 1px solid var(--border); padding: 8px 12px; }
    .content th { background: var(--code-bg); }
    .content a { color: var(--accent); }
    .content img { max-width: 100%; }

    /* ---------- 页脚署名 ---------- */
    .site-footer {
      padding: 16px 28px 24px;
      font-size: 12px;
      color: var(--text-muted);
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
    }
    .site-footer a { color: var(--accent); text-decoration: none; }
    .site-footer a:hover { text-decoration: underline; }
    .site-footer { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .pro-cta {
      margin-left: auto; display: inline-flex; align-items: center; gap: 4px;
      padding: 5px 12px; border: 1px solid rgba(201,154,30,.55); border-radius: 999px;
      font-size: 12px; font-weight: 600; color: #9a6f00 !important;
      background: rgba(201,154,30,.1); text-decoration: none !important; white-space: nowrap;
    }
    .pro-cta:hover { background: rgba(201,154,30,.22); }
    .pro-cta[hidden] { display: none !important; }
    .attribution-warning {
      margin: 0 auto 12px;
      max-width: 900px;
      padding: 10px 14px;
      font-size: 12px;
      color: #8a4600;
      background: #fff4e5;
      border: 1px solid #ffd8a8;
      border-radius: 8px;
    }

    /* ---------- 移动端 ---------- */
    .menu-btn {
      display: none;
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 15px;
      cursor: pointer;
    }
    @media (max-width: 860px) {
      .sidebar {
        position: fixed;
        left: 0; top: 0; bottom: 0;
        z-index: 20;
        transform: translateX(-100%);
        transition: transform .2s;
        box-shadow: 2px 0 12px rgba(0,0,0,.15);
      }
      .sidebar.open { transform: translateX(0); }
      .menu-btn { display: inline-flex; }
      .content { padding: 18px; }
    }
    /* ---------- 站内右键菜单 ---------- */
    .ctx-menu{position:fixed;z-index:9998;min-width:212px;padding:6px;border-radius:12px;background:#121828;
      border:1px solid #2a3350;box-shadow:0 18px 48px rgba(0,0,0,.5);backdrop-filter:blur(10px)}
    .ctx-item{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;padding:8px 10px;
      border:none;border-radius:8px;background:none;color:#e9ecf8;font-size:13.5px;text-align:left;cursor:pointer}
    .ctx-item:hover{background:rgba(110,168,254,.12)}
    .ctx-label{font-weight:500}
    .ctx-hint{font-size:11.5px;color:#8d99bb}
    .ctx-sep{height:1px;background:#2a3350;margin:5px 4px}
    .ctx-mask{position:fixed;inset:0;background:rgba(8,11,18,.7);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px}
    .ctx-modal{width:100%;max-width:520px;background:#141a29;border:1px solid #2a3350;border-radius:14px;
      padding:20px;color:#e9ecf8;font-size:13.5px;box-shadow:0 24px 70px rgba(0,0,0,.55)}
    .ctx-x{border:none;background:none;color:#8d99bb;font-size:20px;cursor:pointer;line-height:1}
    .ctx-send{padding:9px 16px;border:none;border-radius:9px;background:linear-gradient(135deg,#4f8cff,#7b6cf6);color:#fff;font-size:13px;font-weight:600;cursor:pointer}
    .ctx-answer{max-height:46vh;overflow:auto;line-height:1.7;font-size:13.5px}
    .prop{display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-bottom:1px dashed #2a3350;font-size:13.5px}
    .prop:last-child{border-bottom:none}
    .prop span{color:#8d99bb}
    .prop b{font-weight:600;word-break:break-all;text-align:right}
      /* ---------- 设置 ---------- */
    .set-btn-gear{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;padding:0;
      border:1px solid var(--border);border-radius:9px;background:var(--bg);color:var(--text-muted);cursor:pointer}
    .set-btn-gear:hover{color:var(--accent);border-color:var(--accent)}
    .set-mask{position:fixed;inset:0;background:rgba(8,11,18,.6);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px}
    .set-modal{width:100%;max-width:440px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:14px;
      padding:20px;font-size:13.5px;box-shadow:0 24px 70px rgba(0,0,0,.4)}
    .set-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
    .set-head b{font-size:15px}
    .set-x{border:none;background:none;color:var(--text-muted);font-size:20px;cursor:pointer;line-height:1}
    .set-label{font-size:12px;color:var(--text-muted);margin:12px 0 8px}
    .set-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .seg{display:inline-flex;border:1px solid var(--border);border-radius:9px;overflow:hidden}
    .seg button{padding:7px 16px;border:none;background:none;color:var(--text);font-size:12.5px;cursor:pointer}
    .seg button.on{background:var(--accent);color:#fff}
    .swatches{display:flex;align-items:center;gap:9px}
    .swatches button{width:24px;height:24px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;
      box-shadow:0 0 0 1px var(--border)}
    .swatches button.on{border-color:var(--text)}
    .swatch-custom{width:24px;height:24px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 1px var(--border);cursor:pointer;
      background:conic-gradient(#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
    .swatch-custom input{opacity:0;width:100%;height:100%;cursor:pointer}
    .set-hr{height:1px;background:var(--border);margin:16px 0 4px}
    .set-acct b{font-size:13px}
    .set-note{font-size:11.5px;color:var(--text-muted);margin-top:3px}
    .set-wait{font-size:12px;color:var(--text-muted);margin-top:8px;padding:8px 10px;border:1px dashed var(--border);border-radius:9px}
    .set-link{display:inline-block;margin-top:8px;font-size:12.5px;color:var(--accent);text-decoration:none}
    .set-btn{padding:7px 14px;border:none;border-radius:9px;background:var(--accent);color:#fff;font-size:12.5px;cursor:pointer}
    /* 深色模式补丁：把硬编码白底的控件拉回变量体系 */
    html.r6t5-dark .copy-btn,
    html.r6t5-dark .edit-btn,
    html.r6t5-dark .auth-btn,
    html.r6t5-dark .set-btn-gear,
    html.r6t5-dark .copy-menu button,
    html.r6t5-dark .auth-menu button { background: var(--bg) !important; color: var(--text) !important; border-color: var(--border) !important; }
    html.r6t5-dark .copy-menu,
    html.r6t5-dark .auth-menu { background: var(--sidebar-bg) !important; border-color: var(--border) !important; }
    html.r6t5-dark .copy-menu button:hover,
    html.r6t5-dark .auth-menu button:hover { background: var(--code-bg) !important; }
    html.r6t5-dark .search-item.active,
    html.r6t5-dark .search-item:hover { background: rgba(255,255,255,.06) !important; }
    html.r6t5-dark .edit-btn:hover,
    html.r6t5-dark .copy-btn:hover { border-color: var(--accent) !important; background: var(--code-bg) !important; }
    html.r6t5-dark .menu-btn { background: var(--bg) !important; color: var(--text) !important; border-color: var(--border) !important; }
    html.r6t5-dark .node-link.active,
    html.r6t5-dark .node-link:hover { background: var(--code-bg) !important; color: var(--text) !important; }
    html.r6t5-dark .node-link.active { border-left-color: var(--accent) !important; }
</style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="brand">r6t5 文档</div>
      <nav id="tree"></nav>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="menu-btn" id="menuBtn" aria-label="目录">☰</button>
        <span class="doc-title" id="docTitle">加载中…</span>
        <div class="search-wrap">
          <input class="search-input" id="searchInput" placeholder="搜索文档…" autocomplete="off" spellcheck="false">
          <span class="search-kbd" id="searchKbd">⌘K</span>
          <div class="search-results" id="searchResults" hidden></div>
        </div>
        <div class="copy-group">
          <button class="copy-btn" id="copyBtn" aria-haspopup="true" aria-expanded="false">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
              <path d="M0 6.75C0 5.784.784 5 1.75 5h1.5a.75.75 0 0 1 0 1.5h-1.5a.25.25 0 0 0-.25.25v8.5c0 .138.112.25.25.25h8.5a.25.25 0 0 0 .25-.25v-1.5a.75.75 0 0 1 1.5 0v1.5A1.75 1.75 0 0 1 9.75 16h-8A1.75 1.75 0 0 1 0 14.25ZM6 1.75C6 .784 6.784 0 7.75 0h6.5C15.216 0 16 .784 16 1.75v6.5c0 .966-.784 1.75-1.75 1.75h-6.5A1.75 1.75 0 0 1 6 8.25Zm1.75-.25a.25.25 0 0 0-.25.25v6.5c0 .138.112.25.25.25h6.5a.25.25 0 0 0 .25-.25v-6.5a.25.25 0 0 0-.25-.25Z"/>
            </svg>
            <span id="copyBtnText">复制全文</span>
            <svg class="caret" width="10" height="10" viewBox="0 0 10 10" fill="currentColor" aria-hidden="true">
              <path d="M1.5 3.5 5 7l3.5-3.5Z"/>
            </svg>
          </button>
          <div class="copy-menu" id="copyMenu" hidden>
            <button type="button" data-type="markdown">复制 Markdown</button>
            <button type="button" data-type="xml">复制 XML<span class="menu-desc">（渲染后标签）</span></button>
            <button type="button" data-type="text">复制纯文本</button>
          </div>
        </div>
          <button class="set-btn-gear" id="setBtn" title="设置" aria-label="设置">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 4.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Zm0 1.5a2 2 0 1 1 0 4 2 2 0 0 1 0-4Z"/><path d="M7.3 0h1.4l.3 1.7c.4.1.8.3 1.2.5l1.4-1 1 1-1 1.4c.2.4.4.8.5 1.2L13.7 6l.3.8-.3.8-1.7.3c-.1.4-.3.8-.5 1.2l1 1.4-1 1-1.4-1c-.4.2-.8.4-1.2.5L9.3 16h-1.4l-.3-1.7c-.4-.1-.8-.3-1.2-.5l-1.4 1-1-1 1-1.4c-.2-.4-.4-.8-.5-1.2L1.5 10l-.3-.8.3-.8 1.7-.3c.1-.4.3-.8.5-1.2l-1-1.4 1-1 1.4 1c.4-.2.8-.4 1.2-.5L7.3 0Z" opacity=".45"/></svg>
          </button>
        <button class="copy-btn" id="accountBtn" style="display:none;">登录</button>
        <a class="edit-btn" id="editBtn" target="_blank" rel="noopener">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <path d="M11.013 1.427a1.75 1.75 0 0 1 2.474 0l1.086 1.086a1.75 1.75 0 0 1 0 2.474l-8.61 8.61a1.75 1.75 0 0 1-.765.444l-4.118 1.228a.75.75 0 0 1-.92-.92l1.228-4.118a1.75 1.75 0 0 1 .444-.765l8.61-8.61Z"/>
          </svg>
          在 GitHub 上编辑
        </a>
      </header>
      <article class="content" id="content"></article>
      <footer class="site-footer" id="siteFooter"><span id="footerAttribution">本站由<a id="footerLink" href="https://github.com/TanchiPanda/r6t5-docs-community" target="_blank" rel="noopener">r6t5-docs</a>提供支持<span id="footerProNote">，使用专业版、订制版可去除本标志</span></span><a class="pro-cta" id="proCta" href="https://github.com/TanchiPanda/r6t5-docs-docker#readme" target="_blank" rel="noopener">了解 Pro →</a></footer>
    </div>
  </div>

  <script>
    // ---------- 运行期配置（由服务端注入，管理后台可改） ----------
    // 社区版：署名由服务端强制为标准文案；专业版：管理后台可改署名
    const R6 = window.R6T5 || {};
    const REPO = R6.repo || '用户名/仓库名';
    const DEFAULT_PATH = R6.defaultPath || 'docs/index.md';
    const FOOTER = {
      showProNote: !(R6.pro === true)   // 未激活专业版则显示推广提示
    };
    const ATTRIBUTION = Object.assign({
      name: 'r6t5-docs',
      base: '本站由r6t5-docs提供支持',
      proNote: '，使用专业版、订制版可去除本标志',
      canonical: '本站由r6t5-docs提供支持，使用专业版、订制版可去除本标志',
      templateUrl: 'https://github.com/TanchiPanda/r6t5-docs-community',
      proCtaText: '了解 Pro →',
      proUrl: 'https://github.com/TanchiPanda/r6t5-docs-docker#readme'
    }, R6.attribution || {});

    const treeEl = document.getElementById('tree');
    const contentEl = document.getElementById('content');
    const titleEl = document.getElementById('docTitle');
    const editBtn = document.getElementById('editBtn');
    const copyBtn = document.getElementById('copyBtn');
    const copyBtnText = document.getElementById('copyBtnText');
    const copyMenu = document.getElementById('copyMenu');
    const siteFooter = document.getElementById('siteFooter');

    let rawMarkdown = '';

    // ---------- 署名与「了解 Pro」防篡改 ----------
    // 社区版：署名 + 「了解 Pro」入口都必须存在且逐字符一致，删改即还原并提示。
    // 专业版：隐藏入口、可去掉提示，署名仍按授权要求保留。
    function buildFooter() {
      siteFooter.innerHTML = '';
      const holder = document.createElement('span');
      holder.id = 'footerAttribution';
      holder.appendChild(document.createTextNode('本站由'));
      const a = document.createElement('a');
      a.id = 'footerLink';
      a.href = ATTRIBUTION.templateUrl;
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = ATTRIBUTION.name;
      holder.appendChild(a);
      holder.appendChild(document.createTextNode('提供支持'));
      if (FOOTER.showProNote) {
        const span = document.createElement('span');
        span.id = 'footerProNote';
        span.textContent = ATTRIBUTION.proNote;
        holder.appendChild(span);
      }
      siteFooter.appendChild(holder);
      if (FOOTER.showProNote) {
        const cta = document.createElement('a');
        cta.id = 'proCta';
        cta.className = 'pro-cta';
        cta.href = ATTRIBUTION.proUrl;
        cta.target = '_blank';
        cta.rel = 'noopener';
        cta.textContent = ATTRIBUTION.proCtaText;
        siteFooter.appendChild(cta);
      }
    }

    function footerBroken() {
      const holder = document.getElementById('footerAttribution');
      const link = document.getElementById('footerLink');
      if (!holder || !link) return true;
      const base = FOOTER.showProNote ? ATTRIBUTION.canonical : ATTRIBUTION.base;
      if ((holder.textContent || '').trim() !== base) return true;
      if (link.getAttribute('href') !== ATTRIBUTION.templateUrl) return true;
      if (link.textContent.trim() !== ATTRIBUTION.name) return true;
      if (FOOTER.showProNote) {
        const cta = document.getElementById('proCta');
        if (!cta) return true;
        if (cta.getAttribute('href') !== ATTRIBUTION.proUrl) return true;
        if (cta.textContent.trim() !== ATTRIBUTION.proCtaText) return true;
        if (cta.hidden || cta.getBoundingClientRect().width < 8) return true;
      }
      return false;
    }

    let footerWarn = null;
    function enforceAttribution(silent) {
      if (!footerBroken()) return false;
      buildFooter();
      if (!silent) {
        if (footerWarn && footerWarn.parentNode) footerWarn.remove();
        footerWarn = document.createElement('div');
        footerWarn.className = 'attribution-warning';
        footerWarn.textContent = '本页署名或「了解 Pro」入口被删改，已按《r6t5-docs 社区版授权条款》恢复。商业使用请保留完整署名与入口。';
        siteFooter.parentNode.insertBefore(footerWarn, siteFooter);
        console.warn('[r6t5-docs] 署名被删改，已自动恢复');
      }
      return true;
    }

    enforceAttribution(true);

    (function watchFooter() {
      let busy = false;
      const tick = () => { if (busy) return; busy = true; try { enforceAttribution(false); } finally { busy = false; } };
      try {
        new MutationObserver(tick).observe(siteFooter, { childList: true, subtree: true, characterData: true, attributes: true });
      } catch (e) {}
      document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
      setInterval(tick, 4000);
    })();

    // ---------- 搜索（⌘K / Ctrl+K，全文 + 标题） ----------
    (function initSearch() {
      const input = document.getElementById('searchInput');
      const box = document.getElementById('searchResults');
      const kbd = document.getElementById('searchKbd');
      if (!input || !box) return;
      if (!/Mac|iPhone|iPad/.test(navigator.platform)) kbd.textContent = 'Ctrl+K';

      let items = [], active = -1, timer = null, reqId = 0;

      const close = () => { box.hidden = true; active = -1; };

      function render(q) {
        if (!items.length) {
          box.innerHTML = '<div class="search-empty">没有匹配「' + esc(q) + '」的文档</div>';
          box.hidden = false;
          return;
        }
        box.innerHTML = items.map((it, i) =>
          '<div class="search-item' + (i === active ? ' active' : '') + '" data-i="' + i + '">'
          + '<div class="st">' + esc(it.title) + (it.locked ? ' <span style="color:#b8860b;font-size:11px;">付费</span>' : '') + '</div>'
          + '<div class="sp">' + esc(it.path) + '</div>'
          + (it.snippet ? '<div class="ss">' + esc(it.snippet) + '</div>' : '')
          + '</div>').join('');
        box.hidden = false;
      }

      async function run(q) {
        const my = ++reqId;
        const r = await fetch('/api/search?q=' + encodeURIComponent(q));
        const d = await r.json().catch(() => ({ items: [] }));
        if (my !== reqId) return;
        items = d.items || d.ok ? (d.items || []) : [];
        active = items.length ? 0 : -1;
        render(q);
      }

      input.addEventListener('input', () => {
        const q = input.value.trim();
        clearTimeout(timer);
        if (!q) { close(); return; }
        timer = setTimeout(() => run(q), 220);
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') { close(); input.blur(); return; }
        if (!box.hidden && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
          e.preventDefault();
          if (!items.length) return;
          active = e.key === 'ArrowDown' ? (active + 1) % items.length : (active - 1 + items.length) % items.length;
          render(input.value.trim());
          return;
        }
        if (e.key === 'Enter') {
          if (!items.length) return;
          e.preventDefault();
          const it = items[Math.max(0, active)];
          if (it) location.href = '?path=' + encodeURIComponent(it.path);
        }
      });

      box.addEventListener('mousedown', (e) => {
        const row = e.target.closest('.search-item');
        if (!row) return;
        e.preventDefault();
        const it = items[+row.dataset.i];
        if (it) location.href = '?path=' + encodeURIComponent(it.path);
      });

      document.addEventListener('keydown', (e) => {
        if ((e.metaKey || e.ctrlKey) && !e.altKey && e.key.toLowerCase() === 'k') {
          e.preventDefault();
          input.focus();
          input.select();
        }
      });

      document.addEventListener('mousedown', (e) => {
        if (!e.target.closest('.search-wrap')) close();
      });
    })();

    function currentPath() {
      const p = new URLSearchParams(location.search).get('path');

    function esc(s) {
      return s.replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    // 递归渲染目录树：有 children 的节点渲染为可折叠分组，否则渲染为文档链接
    function renderNode(node) {
      if (node.children) {
        const details = document.createElement('details');
        details.className = 'group';
        details.open = true;
        const summary = document.createElement('summary');
        summary.textContent = node.title;
        details.appendChild(summary);
        const ul = document.createElement('ul');
        node.children.forEach(child => ul.appendChild(renderNode(child)));
        details.appendChild(ul);
        return details;
      }
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.className = 'node-link';
      a.href = '?path=' + encodeURIComponent(node.path);
      a.textContent = node.title;
      a.dataset.path = node.path;
      li.appendChild(a);
      return li;
    }

    let pointsCfgCache = null;
    async function pointsConfig() {
      if (pointsCfgCache) return pointsCfgCache;
      try { pointsCfgCache = await (await fetch('/api/points/config')).json(); } catch (e) { pointsCfgCache = { enabled: false }; }
      return pointsCfgCache;

    const session = {
      get token() { return localStorage.getItem('r6t5_sb_token') || ''; },
      get refresh() { return localStorage.getItem('r6t5_sb_refresh') || ''; },
      get email() { return localStorage.getItem('r6t5_sb_email') || ''; },
      save(t, r, email) {
        if (t) localStorage.setItem('r6t5_sb_token', t);
        if (r) localStorage.setItem('r6t5_sb_refresh', r);
        if (email) localStorage.setItem('r6t5_sb_email', email);
      },
      clear() { ['r6t5_sb_token', 'r6t5_sb_refresh', 'r6t5_sb_email'].forEach(k => localStorage.removeItem(k)); }
    };

    async function sbFetch(path, body, token) {
      const cfg = await pointsConfig();
      const r = await fetch(cfg.supabaseUrl.replace(/\/$/, '') + path, {
        method: 'POST',
        headers: Object.assign({ 'Content-Type': 'application/json', apikey: cfg.supabaseAnonKey },
          token ? { Authorization: 'Bearer ' + token } : {}),
        body: JSON.stringify(body || {})
      });
      let d = {};
      try { d = await r.json(); } catch (e) {}
      if (!r.ok) throw new Error(d.msg || d.message || d.error_description || d.error || ('HTTP ' + r.status));
      return d;
    }

    async function sbLogin(email, password) {
      const d = await sbFetch('/auth/v1/token?grant_type=password', { email: email, password: password });
      if (!d.access_token) throw new Error('登录失败');
      session.save(d.access_token, d.refresh_token, email);
    }

    async function sbSignup(email, password) {
      const d = await sbFetch('/auth/v1/signup', { email: email, password: password });
      if (d.access_token) { session.save(d.access_token, d.refresh_token, email); return 'logged'; }
      return 'confirm'; // 需邮箱验证

    async function loadDoc() {
      const path = currentPath();
      let res;
      const hdrs = {};
      const tok = localStorage.getItem('r6t5_sb_token') || '';
      if (tok) hdrs['Authorization'] = 'Bearer ' + tok;
      try {
        res = await fetch(path, { headers: hdrs });
        if (!res.ok) throw new Error('HTTP ' + res.status);
      } catch (e) {
        contentEl.innerHTML = '<p>文档加载失败：<code>' + esc(path) + '</code></p>';
        titleEl.textContent = '文档不存在';
        return;
      }
      const md = await res.text();
      rawMarkdown = md;
      window.__r6t5DocRaw = md;
      window.__r6t5Path = path;
      contentEl.innerHTML = marked.parse(md);

      // ---------- 文档积分：内容被截断时展示解锁面板 ----------
      if (res.headers.get('X-R6T5-Locked') === '1') {
        const info = {
          ratio: res.headers.get('X-R6T5-Ratio') || '0',
          price: res.headers.get('X-R6T5-Price') || '0',
          payReady: res.headers.get('X-R6T5-PayReady') === '1',
          admin: decodeURIComponent(res.headers.get('X-R6T5-Admin-Mail') || ''),
          path: path
        };
        contentEl.appendChild(buildLockPanel(info));
      }

      const h1 = contentEl.querySelector('h1');
      const title = h1 ? h1.textContent.trim() : path;
      titleEl.textContent = title;
      document.title = title + ' · ' + (R6.title || 'r6t5 文档');

      editBtn.href = 'https://github.com/' + REPO + '/edit/main/' + path;

      document.querySelectorAll('.node-link').forEach(a => {
        a.classList.toggle('active', a.dataset.path === path);
      });
    }

    refreshAccountBtn();

    (async () => {
      try {
        await loadManifest();
      } catch (e) {
        contentEl.innerHTML = '<p>目录加载失败：' + esc(e.message) + '</p>';
      }
      await loadDoc();
    })();

    async function writeClipboard(text) {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
      } else {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
    }

    function flashCopied(label) {
      copyBtnText.textContent = label;
      copyBtn.disabled = true;
      setTimeout(() => {
        copyBtnText.textContent = '复制全文';
        copyBtn.disabled = false;
      }, 1500);
    }

    copyBtn.addEventListener('click', e => {
      e.stopPropagation();
      const open = copyMenu.hidden;
      copyMenu.hidden = !open;
      copyBtn.setAttribute('aria-expanded', String(open));
    });

    copyMenu.addEventListener('click', async e => {
      e.stopPropagation();
      const item = e.target.closest('[data-type]');
      if (!item) return;
      const type = item.dataset.type;
      let text = '';
      let label = '已复制';
      if (type === 'markdown') {
        text = rawMarkdown;
        label = 'Markdown 已复制';
      } else if (type === 'xml') {
        text = contentEl.innerHTML;
        label = 'XML 已复制';
      } else {
        text = contentEl.innerText.replace(/\n{3,}/g, '\n\n');
        label = '纯文本已复制';
      }
      try {
        await writeClipboard(text);
        flashCopied(label);
      } catch (err) {
        alert('复制失败，请手动选择内容复制');
      }
      copyMenu.hidden = true;
      copyBtn.setAttribute('aria-expanded', 'false');
    });

    document.addEventListener('click', () => {
      copyMenu.hidden = true;
      copyBtn.setAttribute('aria-expanded', 'false');
    });

    // 移动端抽屉菜单
    document.getElementById('menuBtn').addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('open');
    });
    treeEl.addEventListener('click', e => {
      if (e.target.closest('.node-link')) {
        document.getElementById('sidebar').classList.remove('open');
      }
    });
  </script>
  <script src="license-gate.js"></script>
  <script>
    // ---------- 站内右键菜单 ----------
    (function initContextMenu() {
      const R6c = (typeof R6 !== 'undefined' && R6) || {};
      // manifest 是异步加载的，这里必须惰性求值，否则菜单会一直置灰
      const aiCfg = () => Object.assign({ endpoint: R6c.aiEndpoint || '' }, (typeof MANIFEST !== 'undefined' && MANIFEST && MANIFEST.ai) || {});
      const REPO_CFG = ((typeof REPO !== 'undefined' && REPO) || (typeof MANIFEST !== 'undefined' && MANIFEST && MANIFEST.repo) || '');
      const repoUsable = REPO_CFG && !/用户名|example/i.test(REPO_CFG);

      let menu = null;
      let nativeNext = false;

      function curPath() {
        return window.__r6t5Path || (new URLSearchParams(location.search).get('path') || (typeof DEFAULT_PATH !== 'undefined' ? DEFAULT_PATH : ''));
      }
      function curText() {
        return window.__r6t5DocRaw || '';
      }

      function toast(msg) {
        const t = document.createElement('div');
        t.textContent = msg;
        t.style.cssText = 'position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:#1b2132;color:#e9ecf8;'
          + 'border:1px solid #2a3350;border-radius:9px;padding:8px 14px;font-size:13px;z-index:9999;box-shadow:0 10px 30px rgba(0,0,0,.35)';
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 2200);
      }

      function item(label, hint, handler, disabled) {
        const b = document.createElement('button');
        b.className = 'ctx-item';
        b.innerHTML = '<span class="ctx-label">' + label + '</span>' + (hint ? '<span class="ctx-hint">' + hint + '</span>' : '');
        if (disabled) { b.disabled = true; b.style.opacity = '.45'; }
        else b.onclick = () => { close(); handler(); };
        return b;
      }

      function close() { if (menu) { menu.remove(); menu = null; } }

      function open(x, y, sel) {
        close();
        menu = document.createElement('div');
        menu.className = 'ctx-menu';
        menu.appendChild(item('AI 对话', 'Workers AI', () => openAI(sel), !aiCfg().endpoint));
        menu.appendChild(item('复制', sel ? '选中内容' : '全文', () => copy(sel)));
        menu.appendChild(item('纠错', '提到 GitHub Issue', () => reportIssue(sel)));
        menu.appendChild(item('属性', '大小 / 提交 / 字数', () => showProps()));
        const sep = document.createElement('div'); sep.className = 'ctx-sep';
        menu.appendChild(sep);
        menu.appendChild(item('显示更多选项', '浏览器菜单', () => {
          nativeNext = true;
          toast('已切换为浏览器菜单，请再次右键');
        }));
        document.body.appendChild(menu);
        const w = menu.offsetWidth, h = menu.offsetHeight;
        menu.style.left = Math.min(x, window.innerWidth - w - 8) + 'px';
        menu.style.top = Math.min(y, window.innerHeight - h - 8) + 'px';
      }

      function copy(sel) {
        const text = sel || curText();
        if (!text) { toast('没有可复制的内容'); return; }
        navigator.clipboard.writeText(text).then(() => toast('已复制'));
      }

      function reportIssue(sel) {
        if (!repoUsable) { toast('未配置仓库，请在配置里填 owner/repo'); return; }
        const path = curPath();
        const title = '[Bug] 内容纠错：' + path;
        const base = 'https://github.com/' + REPO_CFG + '/issues/new?template=bug_report.yml&title=' + encodeURIComponent(title);
        window.open(base, '_blank');
      }

      async function showProps() {
        const path = curPath();
        const raw = curText();
        const chars = raw.replace(/\s+/g, '').length;
        const bytes = new Blob([raw]).size;
        const box = modal(
          '<b style="font-size:15px">文档属性</b>'
          + '<div class="prop"><span>路径</span><b>' + esc(path) + '</b></div>'
          + '<div class="prop"><span>字数</span><b>' + chars + '</b></div>'
          + '<div class="prop"><span>大小</span><b>' + fmtBytes(bytes) + '</b></div>'
          + '<div class="prop"><span>上次提交</span><b id="propCommit">读取中…</b></div>'
        );
        if (!repoUsable || !path) { const n = box.querySelector('#propCommit'); if (n) n.textContent = '未配置仓库'; return; }
        try {
          const r = await fetch('https://api.github.com/repos/' + REPO_CFG + '/commits?path=' + encodeURIComponent(path) + '&per_page=1');
          if (r.ok) {
            const arr = await r.json();
            const c = arr && arr[0];
            const n = box.querySelector('#propCommit');
            if (n) n.textContent = c ? (c.commit.author.date.slice(0, 10) + ' · ' + (c.commit.message || '').split('\n')[0].slice(0, 34)) : '无记录';
          } else {
            const n = box.querySelector('#propCommit'); if (n) n.textContent = 'GitHub API 限流，稍后再试';
          }
        } catch (e) { const n = box.querySelector('#propCommit'); if (n) n.textContent = '读取失败'; }
      }

      function fmtBytes(n) {
        if (n < 1024) return n + ' B';
        if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
        return (n / 1024 / 1024).toFixed(2) + ' MB';
      }

      function modal(innerHTML) {
        const mask = document.createElement('div');
        mask.className = 'ctx-mask';
        mask.innerHTML = '<div class="ctx-modal">' + innerHTML + '</div>';
        mask.addEventListener('click', e => { if (e.target === mask) mask.remove(); });
        document.body.appendChild(mask);
        return mask.querySelector('.ctx-modal');
      }

      function openAI(sel) {
        if (window.R6AI && window.R6AI.openWith) { window.R6AI.openWith(sel); return; }
        if (!aiCfg().endpoint) { toast('管理员还没配置 AI 接口'); return; }
        const path = curPath();
        const raw = curText();
        const box = modal(
          '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">'
          + '<b style="font-size:15px">AI 对话 · 本文</b>'
          + '<button class="ctx-x">×</button></div>'
          + '<div style="font-size:12.5px;color:#8d99bb;margin-bottom:8px">基于《' + esc(path) + '》，由 Workers AI 回答</div>'
          + '<div class="ctx-answer" id="aiAnswer">' + (sel ? '<div style="color:#8d99bb;font-size:13px">已带入选中内容，直接提问即可。</div>' : '<div style="color:#8d99bb;font-size:13px">可以问这篇文档讲了什么、某段怎么理解。</div>') + '</div>'
          + '<div style="display:flex;gap:8px;margin-top:12px">'
          + '<input id="aiInput" placeholder="' + (sel ? '针对选中内容提问…' : '针对本文提问…') + '" style="flex:1;padding:9px 12px;border-radius:9px;border:1px solid #2a3350;background:#0d1220;color:#e9ecf8;font-size:13px">'
          + '<button class="ctx-send" id="aiSend">发送</button></div>'
        );
        box.querySelector('.ctx-x').onclick = () => box.parentNode.remove();
        const input = box.querySelector('#aiInput');
        const ans = box.querySelector('#aiAnswer');
        const send = box.querySelector('#aiSend');
        const ask = async () => {
          const q = input.value.trim();
          if (!q) return;
          ans.innerHTML = '<div style="color:#8d99bb">思考中…</div>';
          try {
            const r = await fetch(aiCfg().endpoint, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ question: q, doc: path, context: (sel || raw).slice(0, 1200), locale: 'zh' })
            });
            const d = await r.json().catch(() => ({}));
            if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
            ans.innerHTML = '<div style="white-space:pre-wrap">' + esc(d.text || d.response || d.answer || '（无回答）') + '</div>';
          } catch (e) {
            ans.innerHTML = '<div style="color:#ff9b9b">AI 服务不可用：' + esc(e.message) + '</div>';
          }
        };
        send.onclick = ask;
        input.onkeydown = e => { if (e.key === 'Enter') ask(); };
        input.focus();
      }

      // ---------- 移动端：选中文字后的横条操作栏 ----------
      (function initMobileBar() {
        const coarse = (window.matchMedia && window.matchMedia('(pointer: coarse)').matches)
          || ('ontouchstart' in window) || /[?&]mobile=1/.test(location.search);
        if (!coarse) return;
        const style = document.createElement('style');
        style.textContent = '.ctx-bar{position:fixed;left:50%;transform:translateX(-50%);width:calc(100% - 16px);max-width:520px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:9998;display:flex;gap:6px;align-items:center;padding:8px 10px;background:#1b2132;border:1px solid #2a3350;border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.4);overflow-x:auto}'
          + '.ctx-bar button{flex:0 0 auto;background:none;border:none;color:#e9ecf8;font-size:13.5px;padding:8px 11px;border-radius:9px;white-space:nowrap}'
          + '.ctx-bar button:active{background:#2a3350}'
          + '.ctx-bar .bar-x{margin-left:auto;color:#8d99bb;font-size:17px;padding:2px 9px}';
        document.head.appendChild(style);
        let bar = null, timer = null, lastSel = '';
        function hideBar() { if (bar) { bar.remove(); bar = null; } }
        function curSel() { return String(window.getSelection ? window.getSelection() : '').trim(); }
        function showBar() {
          const s = curSel();
          if (!s || s.length < 2) { hideBar(); return; }
          if (bar && s === lastSel) return;
          lastSel = s; hideBar();
          bar = document.createElement('div');
          bar.className = 'ctx-bar';
          const mk = (label, fn) => {
            const b = document.createElement('button');
            b.textContent = label;
            b.onclick = () => { hideBar(); fn(); };
            bar.appendChild(b);
          };
          mk('AI 对话', () => openAI(s));
          mk('复制', () => copy(s));
          mk('纠错', () => reportIssue(s));
          mk('属性', () => showProps());
          const x = document.createElement('button');
          x.className = 'bar-x'; x.textContent = '×'; x.onclick = hideBar;
          bar.appendChild(x);
          document.body.appendChild(bar);
        }
        function later() { clearTimeout(timer); timer = setTimeout(showBar, 260); }
        document.addEventListener('selectionchange', later);
        document.addEventListener('touchend', later, { passive: true });
        document.addEventListener('touchstart', e => {
          if (bar && e.target && e.target.closest && e.target.closest('.ctx-bar')) return;
          later();
        }, { passive: true });
        window.addEventListener('scroll', hideBar, { passive: true });
      })();

      document.addEventListener('contextmenu', e => {
        if (nativeNext) { nativeNext = false; return; }
        if (e.target.closest('input, textarea, [contenteditable="true"]')) return;
        e.preventDefault();
        const sel = String(window.getSelection() || '').trim();
        open(e.clientX, e.clientY, sel);
      });

      document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
      document.addEventListener('mousedown', e => { if (menu && !e.target.closest('.ctx-menu')) close(); });
      window.addEventListener('scroll', close, true);
    })();
    // ---------- 设置：主题 + 账号 ----------
    (function initSettings() {
      const KEY = 'r6t5.prefs';
      const PRESETS = [
        { name: '蓝', color: '#0969da' },
        { name: '红', color: '#d1242f' },
        { name: '黄', color: '#bf8700' },
        { name: '绿', color: '#1a7f37' },
      ];
      const DARK = { bg: '#0d1117', side: '#11151c', border: '#262d3a', text: '#e6edf3', muted: '#9aa4b2', code: '#161b22' };

      function read() { try { return JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { return {}; } }
      function save(p) { try { localStorage.setItem(KEY, JSON.stringify(p)); } catch (e) {} }

      function apply(p) {
        const r = document.documentElement;
        r.style.setProperty('--accent', p.accent || PRESETS[0].color);
        if (p.mode === 'dark') {
          r.style.setProperty('--bg', DARK.bg);
          r.style.setProperty('--sidebar-bg', DARK.side);
          r.style.setProperty('--border', DARK.border);
          r.style.setProperty('--text', DARK.text);
          r.style.setProperty('--text-muted', DARK.muted);
          r.style.setProperty('--code-bg', DARK.code);
          r.style.colorScheme = 'dark';
          r.classList.add('r6t5-dark');
        } else {
          ['--bg', '--sidebar-bg', '--border', '--text', '--text-muted', '--code-bg'].forEach(k => r.style.removeProperty(k));
          r.style.colorScheme = 'light';
          r.classList.remove('r6t5-dark');
        }
      }
      apply(read());

      const gear = document.getElementById('setBtn');
      if (!gear) return;

      function accountHTML() {
        const hubOn = ((typeof MANIFEST !== 'undefined' && MANIFEST && MANIFEST.auth) || {}).hub !== false;
        const hubUser = (hubOn && typeof sbGetUser === 'function') ? sbGetUser() : null;
        if (hubUser) {
          return '<div class="set-acct"><b>' + (hubUser.email || '') + '</b>'
            + '<div class="set-note">R6T5 开放平台账号</div>'
            + '<a class="set-link" href="https://myacc.r6t5.dpdns.org/?app=open-platform&country=cf" target="_blank" rel="noopener">账号管理 →</a></div>';
        }
        const siteUser = window.__r6t5SiteUser || ((typeof session !== 'undefined' && session && session.email) ? session : null);
        if (siteUser && siteUser.email) {
          return '<div class="set-acct"><b>' + siteUser.email + '</b>'
            + '<div class="set-note">本站账号（站点管理员配置）</div>'
            + '<div class="set-wait">请等待适配开放平台的自定义账号系统</div></div>';
        }
        if (hubOn && typeof msLogin === 'function') {
          return '<div class="set-acct"><div class="set-note">未登录</div>'
            + '<button class="set-btn" id="setLogin">登录开放平台账号</button></div>';
        }
        return '<div class="set-acct"><div class="set-note">未登录</div>'
          + '<div class="set-wait">请等待适配开放平台的自定义账号系统</div></div>';
      }

      function open() {
        const p = read();
        const mask = document.createElement('div');
        mask.className = 'set-mask';
        mask.innerHTML = '<div class="set-modal">'
          + '<div class="set-head"><b>设置</b><button class="set-x">×</button></div>'
          + '<div class="set-label">主题</div>'
          + '<div class="set-row"><div class="seg" id="setMode">'
          + '<button data-mode="light"' + (p.mode !== 'dark' ? ' class="on"' : '') + '>浅色</button>'
          + '<button data-mode="dark"' + (p.mode === 'dark' ? ' class="on"' : '') + '>深色</button></div></div>'
          + '<div class="set-label">强调色</div>'
          + '<div class="set-row"><div class="swatches" id="setSwatch">'
          + PRESETS.map(s => '<button data-color="' + s.color + '" title="' + s.name + '"'
            + ' style="background:' + s.color + '"' + ((p.accent || PRESETS[0].color) === s.color ? ' class="on"' : '') + '></button>').join('')
          + '<label class="swatch-custom" title="自定义"><input type="color" id="setColor" value="' + (p.accent || PRESETS[0].color) + '"></label>'
          + '</div></div>'
          + '<div class="set-hr"></div>'
          + '<div class="set-label">账号</div>'
          + '<div class="set-row" id="setAcctWrap">' + accountHTML() + '</div>'
          + '</div>';
        document.body.appendChild(mask);
        mask.addEventListener('click', e => { if (e.target === mask) mask.remove(); });
        mask.querySelector('.set-x').onclick = () => mask.remove();

        mask.querySelectorAll('#setMode button').forEach(b => {
          b.onclick = () => {
            const cur = read();
            cur.mode = b.dataset.mode;
            save(cur); apply(cur);
            mask.querySelectorAll('#setMode button').forEach(x => x.classList.toggle('on', x === b));
          };
        });
        mask.querySelectorAll('#setSwatch button').forEach(b => {
          b.onclick = () => {
            const cur = read();
            cur.accent = b.dataset.color;
            save(cur); apply(cur);
            mask.querySelector('#setColor').value = cur.accent;
            mask.querySelectorAll('#setSwatch button').forEach(x => x.classList.toggle('on', x === b));
          };
        });
        mask.querySelector('#setColor').oninput = e => {
          const cur = read();
          cur.accent = e.target.value;
          save(cur); apply(cur);
          mask.querySelectorAll('#setSwatch button').forEach(x => x.classList.remove('on'));
        };
        const loginBtn = mask.querySelector('#setLogin');
        if (loginBtn) loginBtn.onclick = () => msLogin({ returnTo: location.href });
      }

      gear.addEventListener('click', open);
    })();
</script>

.r6ai-send{padding:9px 14px;border:none;border-radius:9px;background:#4c8bf5;color:#fff;font-size:13px;cursor:pointer}
.r6ai-send:disabled{opacity:.55}
.r6ai-fab{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));width:52px;height:52px;border-radius:50%;border:none;background:#4c8bf5;color:#fff;font-size:15px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:9991;display:none}
.r6ai-fab.show{display:block}
@media (max-width:900px){
  .r6ai{top:0;width:100%;max-width:520px;left:auto;box-shadow:-12px 0 30px rgba(0,0,0,.25);transform:translateX(100%);transition:transform .22s ease}
  .r6ai.open{transform:none}
  .r6ai.hide{display:flex;transform:translateX(100%)}
  .r6ai-fab{display:block}
}
@media (min-width:1280px){ body.r6ai-spacer{padding-right:364px} }
</style>
<button class="r6ai-fab" id="r6aiFab" aria-label="AI 助手">AI</button>
<aside class="r6ai hide" id="r6ai">
  <div class="r6ai-head">
    <div class="r6ai-title">AI 助手<span class="r6ai-sub">Workers AI</span></div>
    <div class="r6ai-acts">
      <button class="r6ai-new" id="r6aiNew">新对话</button>
      <button class="r6ai-collapse" id="r6aiCollapse" aria-label="折叠侧栏">⟩</button>
    </div>
  </div>
  <div class="r6ai-body" id="r6aiBody"></div>
  <div class="r6ai-compose">
    <div class="r6ai-tools">
      <button class="r6ai-chip" id="r6aiDeep">深度思考</button>
      <button class="r6ai-chip" id="r6aiQuoteBtn" hidden>引用选中</button>
    </div>
    <div class="r6ai-quotebox" id="r6aiQuoteBox"></div>
    <div class="r6ai-inputwrap">
      <textarea id="r6aiInput" rows="1" placeholder="有什么我可以帮你吗？"></textarea>
      <button class="r6ai-send" id="r6aiSend">发送</button>
    </div>
  </div>
</aside>
<script>
(function () {
  var STORE = 'r6t5.aiSidebar.v1';
  var box = document.getElementById('r6ai');
  var body = document.getElementById('r6aiBody');
  var input = document.getElementById('r6aiInput');
  var sendBtn = document.getElementById('r6aiSend');
  var fab = document.getElementById('r6aiFab');
  var deepBtn = document.getElementById('r6aiDeep');
  var quoteBtn = document.getElementById('r6aiQuoteBtn');
  var quoteBox = document.getElementById('r6aiQuoteBox');
  var isMobile = function () { return window.matchMedia('(max-width:900px)').matches; };
  var state = { convos: [], current: null, deep: false, quote: '' };

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); }
  function save() { try { localStorage.setItem(STORE, JSON.stringify({ convos: state.convos.slice(0, 30) })); } catch (e) {} }
  function load() { try { var d = JSON.parse(localStorage.getItem(STORE) || '{}'); state.convos = Array.isArray(d.convos) ? d.convos : []; } catch (e) {} }
  function endpoint() {
    try { if (window.MANIFEST && MANIFEST.ai && MANIFEST.ai.endpoint) return MANIFEST.ai.endpoint; } catch (e) {}
    return (window.R6 && R6.aiEndpoint) || '';
  }
  function docPath() { return window.__r6t5Path || (new URLSearchParams(location.search).get('path') || ''); }
  function docText() { return window.__r6t5DocRaw || ''; }

  var FOLD_KEY = 'r6t5.aiSidebar.folded';
  function fabSync(show) { fab.classList.toggle('show', !!show); }
  function openPanel() {
    box.classList.remove('hide', 'folded');
    box.classList.add('open');
    if (!isMobile() && window.innerWidth >= 1280) document.body.classList.add('r6ai-spacer');
    if (!isMobile()) { body.classList.remove('hide'); fabSync(false); try { localStorage.removeItem(FOLD_KEY); } catch (e) {} }
  }
  function closePanel() { box.classList.remove('open'); if (isMobile()) box.classList.add('hide'); }
  function foldPanel() {
    box.classList.add('folded'); box.classList.remove('open');
    document.body.classList.remove('r6ai-spacer');
    fabSync(true);
    try { localStorage.setItem(FOLD_KEY, '1'); } catch (e) {}
  }

  function render() {
    if (state.current && state.current.messages.length) renderChat();
    else renderHome();
  }

  function renderHome() {
    var html = '<div class="r6ai-hello">有什么我可以帮你吗？</div>'
      + '<div class="r6ai-hint">可以问我这篇文档讲了什么、某段怎么理解，也能接着上一篇继续聊。</div>';
    if (state.convos.length) {
      html += '<div class="r6ai-hishead">历史对话</div><div class="r6ai-his">';
      state.convos.forEach(function (c) {
        html += '<button class="r6ai-hitem" data-cid="' + c.id + '"><span class="r6ai-htitle">' + esc(c.title || '未命名对话') + '</span>'
          + '<span class="r6ai-hdel" data-del="' + c.id + '">×</span></button>';
      });
      html += '</div>';
    }
    body.innerHTML = html;
  }

  function renderChat() {
    var msgs = state.current.messages;
    body.innerHTML = msgs.map(function (m) {
      return '<div class="r6ai-msg ' + (m.role === 'user' ? 'user' : 'ai') + '"><div class="r6ai-bubble">'
        + (m.quote ? '<span class="r6ai-quote">' + esc(m.quote.slice(0, 160)) + '</span>' : '')
        + esc(m.content) + '</div></div>';
    }).join('');
    body.scrollTop = body.scrollHeight;
  }

  function newChat() {
    if (state.current && state.current.messages.length) {
      state.current.id = state.current.id || String(Date.now());
      state.current.title = state.current.title || state.current.messages[0].content.slice(0, 24);
      state.convos.unshift(state.current);
      save();
    }
    state.current = { id: String(Date.now()), title: '', messages: [] };
    renderHome();
    input.focus();
  }

  async function ask() {
    var q = input.value.trim();
    if (!q) return;
    if (!endpoint()) { alert('管理员还没配置 AI 接口'); return; }
    state.current = state.current || { id: String(Date.now()), title: '', messages: [] };
    var quote = state.quote;
    state.current.messages.push({ role: 'user', content: q, quote: quote });
    if (!state.current.title) state.current.title = q.slice(0, 24);
    input.value = ''; setQuote('');
    renderChat();
    sendBtn.disabled = true;
    var bubble = document.createElement('div');
    bubble.className = 'r6ai-msg ai';
    bubble.innerHTML = '<div class="r6ai-bubble">思考中…</div>';
    body.appendChild(bubble); body.scrollTop = body.scrollHeight;
    try {
      var hist = state.current.messages.slice(0, -1).map(function (m) { return { role: m.role, content: m.content }; });
      var r = await fetch(endpoint(), {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: q, doc: docPath(), context: quote || docText().slice(0, 1200), history: hist, deep: state.deep, locale: 'zh' })
      });
      var d = await r.json().catch(function () { return {}; });
      if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
      var text = d.text || d.response || d.answer || '（无回答）';
      state.current.messages.push({ role: 'assistant', content: text });
      bubble.querySelector('.r6ai-bubble').textContent = text;
      save();
    } catch (e) {
      bubble.querySelector('.r6ai-bubble').textContent = 'AI 服务不可用：' + (e.message || '未知错误');
    } finally {
      sendBtn.disabled = false; body.scrollTop = body.scrollHeight;
    }
  }

  function setQuote(t) {
    state.quote = t || '';
    quoteBox.textContent = state.quote;
    quoteBox.classList.toggle('show', !!state.quote);
    quoteBtn.hidden = !state.quote;
  }

  function selectionText() {
    var s = String(window.getSelection ? window.getSelection() : '').trim();
    return s.length >= 2 ? s.slice(0, 300) : '';
  }

  document.addEventListener('selectionchange', function () {
    var s = selectionText();
    if (s) quoteBtn.hidden = false;
    else if (!state.quote) quoteBtn.hidden = true;
  });

  quoteBtn.onclick = function () { setQuote(selectionText() || state.quote); };
  quoteBox.onclick = function () { setQuote(''); };
  deepBtn.onclick = function () { state.deep = !state.deep; deepBtn.classList.toggle('on', state.deep); };
  sendBtn.onclick = ask;
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(); }
  });
  input.addEventListener('input', function () {
    input.style.height = 'auto'; input.style.height = Math.min(120, input.scrollHeight) + 'px';
  });
  document.getElementById('r6aiNew').onclick = newChat;
  body.addEventListener('click', function (e) {
    var del = e.target.closest('[data-del]');
    if (del) {
      e.stopPropagation();
      state.convos = state.convos.filter(function (c) { return c.id !== del.dataset.del; });
      save(); renderHome(); return;
    }
    var item = e.target.closest('[data-cid]');
    if (item) {
      var c = state.convos.find(function (x) { return x.id === item.dataset.cid; });
      if (c) { state.current = { id: c.id, title: c.title, messages: c.messages.slice() }; renderChat(); }
    }
  });
  fab.onclick = function () { openPanel(); if (!state.current) renderHome(); };
  document.getElementById('r6aiCollapse').onclick = foldPanel;

  window.R6AI = {
    openWith: function (sel) {
      openPanel();
      if (sel) { setQuote(sel); }
      render();
      if (sel) input.focus();
    }
  };

  load();
  if (!state.current) state.current = { id: String(Date.now()), title: '', messages: [] };
  render();
  var folded = false; try { folded = localStorage.getItem(FOLD_KEY) === '1'; } catch (e) {}
  if (isMobile()) box.classList.add('hide');
  else if (folded) foldPanel(); else openPanel();
  window.addEventListener('resize', function () {
    if (!isMobile()) openPanel(); else { box.classList.remove('open'); box.classList.add('hide'); document.body.classList.remove('r6ai-spacer'); }
  });
})();
</script>

</body>
</html>
