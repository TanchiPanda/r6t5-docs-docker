<!DOCTYPE html>
<!-- R6T5-DOCS-COMMUNITY-TEMPLATE-V1 | 本模板受《r6t5-docs 社区版授权条款》约束，署名与下方检测标记不得删除 -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="r6t5-docs-template" content="community-v1">
  <meta name="r6t5-docs-attribution" content="required">
  <title>r6t5 文档</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #ffffff;
      --sidebar-bg: #f7f8fa;
      --border: #e5e7eb;
      --text: #1f2328;
      --text-muted: #656d76;
      --accent: #0969da;
      --code-bg: #f6f8fa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.7;
    }
    .layout { display: flex; min-height: 100vh; }

    /* ---------- 侧边栏 ---------- */
    .sidebar {
      width: 280px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      padding: 16px 0;
      flex-shrink: 0;
    }
    .sidebar .brand {
      font-weight: 700;
      font-size: 16px;
      padding: 0 20px 12px;
    }
    .sidebar ul { list-style: none; margin: 0; padding: 0; }
    details.group { margin: 2px 0; }
    details.group > summary {
      cursor: pointer;
      padding: 8px 20px;
      font-weight: 600;
      font-size: 14px;
      list-style: none;
      display: flex;
      align-items: center;
      gap: 6px;
      user-select: none;
    }
    details.group > summary::before {
      content: "▸";
      color: var(--text-muted);
      transition: transform .15s;
      font-size: 12px;
    }
    details.group[open] > summary::before { transform: rotate(90deg); }
    details.group > summary:hover { background: #eceef1; }
    .node-link {
      display: block;
      padding: 7px 20px 7px 36px;
      font-size: 14px;
      color: var(--text);
      text-decoration: none;
    }
    .node-link:hover { background: #eceef1; }
    .node-link.active {
      color: var(--accent);
      background: #ddf4ff;
      font-weight: 600;
    }

    /* ---------- 主区域 ---------- */
    .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 28px;
      border-bottom: 1px solid var(--border);
    }
    .topbar .doc-title { font-size: 15px; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .edit-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      text-decoration: none;
      font-size: 13px;
      background: #fff;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .edit-btn:hover { background: var(--code-bg); border-color: #d0d7de; }

    /* ---------- 复制全文下拉 ---------- */
    .copy-group { position: relative; flex-shrink: 0; }
    .copy-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      background: #fff;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }
    .copy-btn:hover { background: var(--code-bg); }
    .copy-btn .caret { font-size: 10px; color: var(--text-muted); }
    .copy-menu {
      position: absolute;
      right: 0;
      top: calc(100% + 6px);
      min-width: 150px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,.12);
      padding: 6px;
      z-index: 30;
    }
    .copy-menu[hidden] { display: none; }
    .copy-menu button {
      display: block;
      width: 100%;
      text-align: left;
      padding: 8px 12px;
      border: none;
      background: none;
      font-size: 13px;
      border-radius: 6px;
      cursor: pointer;
      color: var(--text);
    }
    .copy-menu button:hover { background: var(--code-bg); }
    .copy-menu .menu-desc { color: var(--text-muted); font-size: 12px; }
    .content {
      padding: 28px;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
    }

    /* ---------- Markdown 渲染样式 ---------- */
    .content h1, .content h2, .content h3, .content h4 { line-height: 1.3; margin-top: 1.6em; }
    .content h1 { font-size: 1.9em; border-bottom: 1px solid var(--border); padding-bottom: .3em; }
    .content h2 { font-size: 1.45em; border-bottom: 1px solid var(--border); padding-bottom: .3em; }
    .content h3 { font-size: 1.2em; }
    .content code {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      background: var(--code-bg);
      padding: 2px 6px;
      border-radius: 5px;
      font-size: 85%;
    }
    .content pre {
      background: var(--code-bg);
      padding: 14px 16px;
      border-radius: 8px;
      overflow-x: auto;
    }
    .content pre code { background: none; padding: 0; }
    .content blockquote {
      margin: 1em 0;
      padding: 2px 16px;
      border-left: 4px solid var(--border);
      color: var(--text-muted);
      background: var(--code-bg);
      border-radius: 0 8px 8px 0;
    }
    .content table { border-collapse: collapse; width: 100%; margin: 1em 0; }
    .content th, .content td { border: 1px solid var(--border); padding: 8px 12px; }
    .content th { background: var(--code-bg); }
    .content a { color: var(--accent); }
    .content img { max-width: 100%; }

    /* ---------- 页脚署名 ---------- */
    .site-footer {
      padding: 16px 28px 24px;
      font-size: 12px;
      color: var(--text-muted);
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
    }
    .site-footer a { color: var(--accent); text-decoration: none; }
    .site-footer a:hover { text-decoration: underline; }
    .site-footer { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .pro-cta {
      margin-left: auto; display: inline-flex; align-items: center; gap: 4px;
      padding: 5px 12px; border: 1px solid rgba(201,154,30,.55); border-radius: 999px;
      font-size: 12px; font-weight: 600; color: #9a6f00 !important;
      background: rgba(201,154,30,.1); text-decoration: none !important; white-space: nowrap;
    }
    .pro-cta:hover { background: rgba(201,154,30,.22); }
    .pro-cta[hidden] { display: none !important; }
    .attribution-warning {
      margin: 0 auto 12px;
      max-width: 900px;
      padding: 10px 14px;
      font-size: 12px;
      color: #8a4600;
      background: #fff4e5;
      border: 1px solid #ffd8a8;
      border-radius: 8px;
    }

    /* ---------- 移动端 ---------- */
    .menu-btn {
      display: none;
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 15px;
      cursor: pointer;
    }
    @media (max-width: 860px) {
      .sidebar {
        position: fixed;
        left: 0; top: 0; bottom: 0;
        z-index: 20;
        transform: translateX(-100%);
        transition: transform .2s;
        box-shadow: 2px 0 12px rgba(0,0,0,.15);
      }
      .sidebar.open { transform: translateX(0); }
      .menu-btn { display: inline-flex; }
      .content { padding: 18px; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="brand">r6t5 文档</div>
      <nav id="tree"></nav>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="menu-btn" id="menuBtn" aria-label="目录">☰</button>
        <span class="doc-title" id="docTitle">加载中…</span>
        <div class="copy-group">
          <button class="copy-btn" id="copyBtn" aria-haspopup="true" aria-expanded="false">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
              <path d="M0 6.75C0 5.784.784 5 1.75 5h1.5a.75.75 0 0 1 0 1.5h-1.5a.25.25 0 0 0-.25.25v8.5c0 .138.112.25.25.25h8.5a.25.25 0 0 0 .25-.25v-1.5a.75.75 0 0 1 1.5 0v1.5A1.75 1.75 0 0 1 9.75 16h-8A1.75 1.75 0 0 1 0 14.25ZM6 1.75C6 .784 6.784 0 7.75 0h6.5C15.216 0 16 .784 16 1.75v6.5c0 .966-.784 1.75-1.75 1.75h-6.5A1.75 1.75 0 0 1 6 8.25Zm1.75-.25a.25.25 0 0 0-.25.25v6.5c0 .138.112.25.25.25h6.5a.25.25 0 0 0 .25-.25v-6.5a.25.25 0 0 0-.25-.25Z"/>
            </svg>
            <span id="copyBtnText">复制全文</span>
            <svg class="caret" width="10" height="10" viewBox="0 0 10 10" fill="currentColor" aria-hidden="true">
              <path d="M1.5 3.5 5 7l3.5-3.5Z"/>
            </svg>
          </button>
          <div class="copy-menu" id="copyMenu" hidden>
            <button type="button" data-type="markdown">复制 Markdown</button>
            <button type="button" data-type="xml">复制 XML<span class="menu-desc">（渲染后标签）</span></button>
            <button type="button" data-type="text">复制纯文本</button>
          </div>
        </div>
        <button class="copy-btn" id="accountBtn" style="display:none;">登录</button>
        <a class="edit-btn" id="editBtn" target="_blank" rel="noopener">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <path d="M11.013 1.427a1.75 1.75 0 0 1 2.474 0l1.086 1.086a1.75 1.75 0 0 1 0 2.474l-8.61 8.61a1.75 1.75 0 0 1-.765.444l-4.118 1.228a.75.75 0 0 1-.92-.92l1.228-4.118a1.75 1.75 0 0 1 .444-.765l8.61-8.61Z"/>
          </svg>
          在 GitHub 上编辑
        </a>
      </header>
      <article class="content" id="content"></article>
      <footer class="site-footer" id="siteFooter"><span id="footerAttribution">本站由<a id="footerLink" href="https://github.com/TanchiPanda/r6t5-docs-community" target="_blank" rel="noopener">r6t5-docs</a>提供支持<span id="footerProNote">，使用专业版、订制版可去除本标志</span></span><a class="pro-cta" id="proCta" href="https://github.com/TanchiPanda/r6t5-docs-docker#readme" target="_blank" rel="noopener">了解 Pro →</a></footer>
    </div>
  </div>

  <script>
    // ---------- 运行期配置（由服务端注入，管理后台可改） ----------
    // 社区版：署名由服务端强制为标准文案；专业版：管理后台可改署名
    const R6 = window.R6T5 || {};
    const REPO = R6.repo || '用户名/仓库名';
    const DEFAULT_PATH = R6.defaultPath || 'docs/index.md';
    const FOOTER = {
      showProNote: !(R6.pro === true)   // 未激活专业版则显示推广提示
    };
    const ATTRIBUTION = Object.assign({
      name: 'r6t5-docs',
      base: '本站由r6t5-docs提供支持',
      proNote: '，使用专业版、订制版可去除本标志',
      canonical: '本站由r6t5-docs提供支持，使用专业版、订制版可去除本标志',
      templateUrl: 'https://github.com/TanchiPanda/r6t5-docs-community',
      proCtaText: '了解 Pro →',
      proUrl: 'https://github.com/TanchiPanda/r6t5-docs-docker#readme'
    }, R6.attribution || {});

    const treeEl = document.getElementById('tree');
    const contentEl = document.getElementById('content');
    const titleEl = document.getElementById('docTitle');
    const editBtn = document.getElementById('editBtn');
    const copyBtn = document.getElementById('copyBtn');
    const copyBtnText = document.getElementById('copyBtnText');
    const copyMenu = document.getElementById('copyMenu');
    const siteFooter = document.getElementById('siteFooter');

    let rawMarkdown = '';

    // ---------- 署名与「了解 Pro」防篡改 ----------
    // 社区版：署名 + 「了解 Pro」入口都必须存在且逐字符一致，删改即还原并提示。
    // 专业版：隐藏入口、可去掉提示，署名仍按授权要求保留。
    function buildFooter() {
      siteFooter.innerHTML = '';
      const holder = document.createElement('span');
      holder.id = 'footerAttribution';
      holder.appendChild(document.createTextNode('本站由'));
      const a = document.createElement('a');
      a.id = 'footerLink';
      a.href = ATTRIBUTION.templateUrl;
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = ATTRIBUTION.name;
      holder.appendChild(a);
      holder.appendChild(document.createTextNode('提供支持'));
      if (FOOTER.showProNote) {
        const span = document.createElement('span');
        span.id = 'footerProNote';
        span.textContent = ATTRIBUTION.proNote;
        holder.appendChild(span);
      }
      siteFooter.appendChild(holder);
      if (FOOTER.showProNote) {
        const cta = document.createElement('a');
        cta.id = 'proCta';
        cta.className = 'pro-cta';
        cta.href = ATTRIBUTION.proUrl;
        cta.target = '_blank';
        cta.rel = 'noopener';
        cta.textContent = ATTRIBUTION.proCtaText;
        siteFooter.appendChild(cta);
      }
    }

    function footerBroken() {
      const holder = document.getElementById('footerAttribution');
      const link = document.getElementById('footerLink');
      if (!holder || !link) return true;
      const base = FOOTER.showProNote ? ATTRIBUTION.canonical : ATTRIBUTION.base;
      if ((holder.textContent || '').trim() !== base) return true;
      if (link.getAttribute('href') !== ATTRIBUTION.templateUrl) return true;
      if (link.textContent.trim() !== ATTRIBUTION.name) return true;
      if (FOOTER.showProNote) {
        const cta = document.getElementById('proCta');
        if (!cta) return true;
        if (cta.getAttribute('href') !== ATTRIBUTION.proUrl) return true;
        if (cta.textContent.trim() !== ATTRIBUTION.proCtaText) return true;
        if (cta.hidden || cta.getBoundingClientRect().width < 8) return true;
      }
      return false;
    }

    let footerWarn = null;
    function enforceAttribution(silent) {
      if (!footerBroken()) return false;
      buildFooter();
      if (!silent) {
        if (footerWarn && footerWarn.parentNode) footerWarn.remove();
        footerWarn = document.createElement('div');
        footerWarn.className = 'attribution-warning';
        footerWarn.textContent = '本页署名或「了解 Pro」入口被删改，已按《r6t5-docs 社区版授权条款》恢复。商业使用请保留完整署名与入口。';
        siteFooter.parentNode.insertBefore(footerWarn, siteFooter);
        console.warn('[r6t5-docs] 署名被删改，已自动恢复');
      }
      return true;
    }

    enforceAttribution(true);

    (function watchFooter() {
      let busy = false;
      const tick = () => { if (busy) return; busy = true; try { enforceAttribution(false); } finally { busy = false; } };
      try {
        new MutationObserver(tick).observe(siteFooter, { childList: true, subtree: true, characterData: true, attributes: true });
      } catch (e) {}
      document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
      setInterval(tick, 4000);
    })();

    marked.setOptions({ gfm: true, breaks: true });

    function currentPath() {
      const p = new URLSearchParams(location.search).get('path');
      return p || DEFAULT_PATH;
    }

    function esc(s) {
      return s.replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    // 递归渲染目录树：有 children 的节点渲染为可折叠分组，否则渲染为文档链接
    function renderNode(node) {
      if (node.children) {
        const details = document.createElement('details');
        details.className = 'group';
        details.open = true;
        const summary = document.createElement('summary');
        summary.textContent = node.title;
        details.appendChild(summary);
        const ul = document.createElement('ul');
        node.children.forEach(child => ul.appendChild(renderNode(child)));
        details.appendChild(ul);
        return details;
      }
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.className = 'node-link';
      a.href = '?path=' + encodeURIComponent(node.path);
      a.textContent = node.title;
      a.dataset.path = node.path;
      li.appendChild(a);
      return li;
    }

    async function loadManifest() {
      const res = await fetch('manifest.json');
      if (!res.ok) throw new Error('manifest.json 加载失败');
      const manifest = await res.json();
      treeEl.innerHTML = '';
      manifest.tree.forEach(n => treeEl.appendChild(renderNode(n)));
    }

    // ---------- 账户与会话 ----------
    let pointsCfgCache = null;
    async function pointsConfig() {
      if (pointsCfgCache) return pointsCfgCache;
      try { pointsCfgCache = await (await fetch('/api/points/config')).json(); } catch (e) { pointsCfgCache = { enabled: false }; }
      return pointsCfgCache;
    }

    const session = {
      get token() { return localStorage.getItem('r6t5_sb_token') || ''; },
      get refresh() { return localStorage.getItem('r6t5_sb_refresh') || ''; },
      get email() { return localStorage.getItem('r6t5_sb_email') || ''; },
      save(t, r, email) {
        if (t) localStorage.setItem('r6t5_sb_token', t);
        if (r) localStorage.setItem('r6t5_sb_refresh', r);
        if (email) localStorage.setItem('r6t5_sb_email', email);
      },
      clear() { ['r6t5_sb_token', 'r6t5_sb_refresh', 'r6t5_sb_email'].forEach(k => localStorage.removeItem(k)); }
    };

    async function sbFetch(path, body, token) {
      const cfg = await pointsConfig();
      const r = await fetch(cfg.supabaseUrl.replace(/\/$/, '') + path, {
        method: 'POST',
        headers: Object.assign({ 'Content-Type': 'application/json', apikey: cfg.supabaseAnonKey },
          token ? { Authorization: 'Bearer ' + token } : {}),
        body: JSON.stringify(body || {})
      });
      let d = {};
      try { d = await r.json(); } catch (e) {}
      if (!r.ok) throw new Error(d.msg || d.message || d.error_description || d.error || ('HTTP ' + r.status));
      return d;
    }

    async function sbLogin(email, password) {
      const d = await sbFetch('/auth/v1/token?grant_type=password', { email: email, password: password });
      if (!d.access_token) throw new Error('登录失败');
      session.save(d.access_token, d.refresh_token, email);
    }

    async function sbSignup(email, password) {
      const d = await sbFetch('/auth/v1/signup', { email: email, password: password });
      if (d.access_token) { session.save(d.access_token, d.refresh_token, email); return 'logged'; }
      return 'confirm'; // 需邮箱验证
    }

    async function myPoints() {
      const cfg = await pointsConfig();
      if (!cfg.authReady) return null;
      const r = await fetch('/api/points/me', { method: 'POST', headers: { Authorization: 'Bearer ' + session.token } });
      const d = await r.json().catch(() => ({ ok: false }));
      return d.ok ? d.me : null;
    }

    async function refreshAccountBtn() {
      const cfg = await pointsConfig();
      if (!cfg.authReady) return;
      const btn = document.getElementById('accountBtn');
      btn.style.display = 'inline-flex';
      if (!session.token) { btn.textContent = '登录'; btn.onclick = () => openAuthModal(); return; }
      const me = await myPoints();
      const vip = me && me.vip_until && new Date(me.vip_until) > new Date();
      btn.textContent = vip ? 'VIP · ' + session.email : session.email + ' · ' + (me ? me.balance : 0) + ' 积分';
      btn.onclick = () => openAccountModal(me);
    }

    // ---------- 登录/注册弹窗 ----------
    function modalShell(inner) {
      const old = document.getElementById('r6t5Modal');
      if (old) old.remove();
      const mask = document.createElement('div');
      mask.id = 'r6t5Modal';
      mask.style.cssText = 'position:fixed;inset:0;background:rgba(10,12,20,.72);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px;';
      mask.innerHTML = '<div style="width:100%;max-width:420px;background:#fff;border-radius:14px;padding:22px;'
        + 'box-shadow:0 20px 60px rgba(0,0,0,.35);font-size:14px;color:#1f2328;line-height:1.75;">'
        + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">'
        + '<b style="font-size:16px;">账户</b><button id="r6t5ModalClose" style="border:none;background:none;font-size:20px;cursor:pointer;color:#888;">×</button></div>'
        + inner + '</div>';
      document.body.appendChild(mask);
      mask.querySelector('#r6t5ModalClose').onclick = () => mask.remove();
      mask.addEventListener('click', (e) => { if (e.target === mask) mask.remove(); });
      return mask;
    }

    function openAuthModal(afterLogin) {
      const box = modalShell(
        '<div style="display:flex;gap:8px;margin-bottom:10px;">'
        + '<button id="tabLogin" style="flex:1;padding:8px;border-radius:8px;border:1px solid #d0d7de;background:#0969da;color:#fff;cursor:pointer;">登录</button>'
        + '<button id="tabSignup" style="flex:1;padding:8px;border-radius:8px;border:1px solid #d0d7de;background:#fff;cursor:pointer;">注册</button>'
        + '</div>'
        + '<input id="auEmail" placeholder="邮箱" style="width:100%;padding:10px;border:1px solid #d0d7de;border-radius:8px;margin-bottom:8px;">'
        + '<input id="auPw" type="password" placeholder="密码（至少 6 位）" style="width:100%;padding:10px;border:1px solid #d0d7de;border-radius:8px;margin-bottom:10px;">'
        + '<button id="auGo" style="width:100%;padding:10px;border:none;border-radius:8px;background:#1f7a4d;color:#fff;cursor:pointer;">登录</button>'
        + '<div id="auMsg" style="font-size:13px;color:#c0392b;min-height:18px;margin-top:8px;"></div>'
        + '<div style="font-size:12px;color:#888;margin-top:6px;">注册即自动开通积分账户，初始 0 积分；积分由管理员充值或用兑换码兑换。</div>'
      );
      let mode = 'login';
      const setMode = (m) => {
        mode = m;
        box.querySelector('#auGo').textContent = m === 'login' ? '登录' : '注册';
        box.querySelector('#tabLogin').style.background = m === 'login' ? '#0969da' : '#fff';
        box.querySelector('#tabLogin').style.color = m === 'login' ? '#fff' : '#1f2328';
        box.querySelector('#tabSignup').style.background = m === 'signup' ? '#0969da' : '#fff';
        box.querySelector('#tabSignup').style.color = m === 'signup' ? '#fff' : '#1f2328';
      };
      setMode('login');
      box.querySelector('#tabLogin').onclick = () => setMode('login');
      box.querySelector('#tabSignup').onclick = () => setMode('signup');
      box.querySelector('#auGo').onclick = async () => {
        const email = box.querySelector('#auEmail').value.trim();
        const pw = box.querySelector('#auPw').value.trim();
        const msg = box.querySelector('#auMsg');
        msg.style.color = '#c0392b';
        if (!email || !pw) { msg.textContent = '请填写邮箱和密码'; return; }
        try {
          if (mode === 'login') { await sbLogin(email, pw); }
          else {
            const r = await sbSignup(email, pw);
            if (r === 'confirm') {
              msg.style.color = '#1f7a4d';
              msg.textContent = '注册成功，请到邮箱点击验证链接后再登录';
              return;
            }
          }
          box.remove();
          await refreshAccountBtn();
          if (afterLogin) afterLogin();
        } catch (e) { msg.textContent = e.message; }
      };
    }

    function openAccountModal(me) {
      const vip = me && me.vip_until && new Date(me.vip_until) > new Date();
      const info = '<div style="margin-bottom:10px;">账号：<b>' + session.email + '</b></div>'
        + '<div style="margin-bottom:10px;">积分余额：<b>' + (me ? me.balance : 0) + '</b></div>'
        + '<div style="margin-bottom:12px;">VIP：' + (vip ? '<b style="color:#1f7a4d;">有效至 ' + new Date(me.vip_until).toLocaleString() + '</b>' : '未开通') + '</div>';
      const box = modalShell(info
        + '<button id="acVip" style="width:100%;padding:9px;border:none;border-radius:8px;background:#c99a1e;color:#fff;cursor:pointer;margin-bottom:8px;">开通 / 续费 VIP（积分支付）</button>'
        + '<button id="acCode" style="width:100%;padding:9px;border:none;border-radius:8px;background:#eaeef2;color:#1f2328;cursor:pointer;margin-bottom:8px;">用兑换码充值</button>'
        + '<button id="acOut" style="width:100%;padding:9px;border:none;border-radius:8px;background:#eaeef2;color:#1f2328;cursor:pointer;">退出登录</button>'
        + '<div id="acMsg" style="font-size:13px;color:#c0392b;min-height:18px;margin-top:8px;"></div>');
      box.querySelector('#acVip').onclick = () => openVipModal();
      box.querySelector('#acOut').onclick = () => { session.clear(); box.remove(); refreshAccountBtn(); };
      box.querySelector('#acCode').onclick = async () => {
        const code = prompt('输入兑换码（R6T5-XXXX-XXXX-XXXX）');
        if (!code) return;
        try {
          const r = await fetch('/api/points/redeem', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + session.token },
            body: JSON.stringify({ code: code })
          });
          const d = await r.json();
          if (!r.ok || !d.ok) throw new Error(d.error || '兑换失败');
          box.querySelector('#acMsg').style.color = '#1f7a4d';
          box.querySelector('#acMsg').textContent = d.kind === 'vip' ? ('已兑换 ' + d.value + ' 天 VIP') : ('已兑换 ' + d.value + ' 积分');
        } catch (e) { box.querySelector('#acMsg').textContent = e.message; }
      };
    }

    async function openVipModal() {
      const cfg = await pointsConfig();
      const plans = cfg.vipPlans || [];
      const box = modalShell('<div style="margin-bottom:10px;color:#666;font-size:13px;">VIP = 本站全部文档解锁，按积分支付，仅对当前站点生效。</div>'
        + (plans.length ? plans.map((p) =>
          '<div style="display:flex;justify-content:space-between;align-items:center;border:1px solid #e5e7eb;border-radius:10px;padding:10px;margin-bottom:8px;">'
          + '<div><b>' + p.label + '</b><div style="font-size:12px;color:#888;">' + p.days + ' 天</div></div>'
          + '<button data-plan="' + p.id + '" style="padding:8px 12px;border:none;border-radius:8px;background:#1f7a4d;color:#fff;cursor:pointer;">' + p.points + ' 积分解锁</button>'
          + '</div>').join('') : '<div style="color:#888;">管理员还没配置 VIP 档位。</div>')
        + '<div id="vipMsg" style="font-size:13px;color:#c0392b;min-height:18px;"></div>');
      box.querySelectorAll('[data-plan]').forEach((b) => {
        b.onclick = async () => {
          if (!session.token) { box.remove(); openAuthModal(); return; }
          const msg = box.querySelector('#vipMsg');
          msg.style.color = '#c0392b';
          try {
            const r = await fetch('/api/points/buy-vip', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + session.token },
              body: JSON.stringify({ planId: b.dataset.plan })
            });
            const d = await r.json();
            if (!r.ok || !d.ok) throw new Error(d.error || '开通失败');
            msg.style.color = '#1f7a4d';
            msg.textContent = '开通成功：' + d.plan + '，剩余积分 ' + d.balance + '，正在刷新…';
            setTimeout(() => location.reload(), 900);
          } catch (e) { msg.textContent = e.message; }
        };
      });
    }

    // ---------- 文档锁定面板 ----------
    function buildLockPanel(info) {
      const box = document.createElement('div');
      box.style.cssText = 'margin:28px 0 8px;padding:18px;border:1px solid #e3c26a;border-radius:10px;'
        + 'background:#fffaf0;color:#3a2f12;font-size:14px;line-height:1.8;';
      const head = '🔒 本文已免费读到 ' + info.ratio + '%，剩余内容需 <b>' + info.price + '</b> 积分解锁。';

      if (!info.payReady) {
        box.innerHTML = '<div style="font-weight:600;margin-bottom:6px;">' + head + '</div>'
          + '<div style="color:#8a5a00;">请联系管理员完善积分系统'
          + (info.admin ? '（<a href="mailto:' + esc(info.admin) + '">' + esc(info.admin) + '</a>）' : '（管理员邮箱未填写）')
          + '。</div>';
        return box;
      }

      if (!session.token) {
        box.innerHTML = '<div style="font-weight:600;margin-bottom:10px;">' + head + '</div>'
          + '<div style="color:#666;font-size:13px;margin-bottom:8px;">登录后可用积分解锁，或开通 VIP 全站解锁。</div>';
        const loginBtn = document.createElement('button');
        loginBtn.textContent = '登录 / 注册';
        loginBtn.style.cssText = 'padding:9px 16px;border:none;border-radius:8px;background:#c99a1e;color:#fff;cursor:pointer;';
        loginBtn.onclick = () => openAuthModal(() => location.reload());
        box.appendChild(loginBtn);
        return box;
      }

      box.innerHTML = '<div style="font-weight:600;margin-bottom:10px;">' + head + '</div>'
        + '<div style="display:flex;gap:8px;flex-wrap:wrap;">'
        + '<button id="lockPay" style="padding:9px 14px;border:none;border-radius:8px;background:#1f7a4d;color:#fff;cursor:pointer;">用 ' + info.price + ' 积分解锁全文</button>'
        + '<button id="lockVip" style="padding:9px 14px;border:none;border-radius:8px;background:#c99a1e;color:#fff;cursor:pointer;">开通 VIP 全站解锁</button>'
        + '</div><div id="lockMsg" style="font-size:13px;margin-top:8px;min-height:18px;color:#c0392b;"></div>';

      setTimeout(() => {
        const msg = box.querySelector('#lockMsg');
        box.querySelector('#lockPay').onclick = async () => {
          try {
            const d = await sbFetch('/rest/v1/rpc/r6t5_unlock_doc', { p_doc: info.path, p_cost: Number(info.price) }, session.token);
            msg.style.color = '#1f7a4d';
            msg.textContent = '解锁成功，剩余积分 ' + d + '，正在刷新…';
            setTimeout(() => location.reload(), 800);
          } catch (e) { msg.textContent = e.message; }
        };
        box.querySelector('#lockVip').onclick = () => openVipModal();
      }, 0);
      return box;
    }

    async function loadDoc() {
      const path = currentPath();
      let res;
      const hdrs = {};
      const tok = localStorage.getItem('r6t5_sb_token') || '';
      if (tok) hdrs['Authorization'] = 'Bearer ' + tok;
      try {
        res = await fetch(path, { headers: hdrs });
        if (!res.ok) throw new Error('HTTP ' + res.status);
      } catch (e) {
        contentEl.innerHTML = '<p>文档加载失败：<code>' + esc(path) + '</code></p>';
        titleEl.textContent = '文档不存在';
        return;
      }
      const md = await res.text();
      rawMarkdown = md;
      contentEl.innerHTML = marked.parse(md);

      // ---------- 文档积分：内容被截断时展示解锁面板 ----------
      if (res.headers.get('X-R6T5-Locked') === '1') {
        const info = {
          ratio: res.headers.get('X-R6T5-Ratio') || '0',
          price: res.headers.get('X-R6T5-Price') || '0',
          payReady: res.headers.get('X-R6T5-PayReady') === '1',
          admin: decodeURIComponent(res.headers.get('X-R6T5-Admin-Mail') || ''),
          path: path
        };
        contentEl.appendChild(buildLockPanel(info));
      }

      const h1 = contentEl.querySelector('h1');
      const title = h1 ? h1.textContent.trim() : path;
      titleEl.textContent = title;
      document.title = title + ' · ' + (R6.title || 'r6t5 文档');

      editBtn.href = 'https://github.com/' + REPO + '/edit/main/' + path;

      document.querySelectorAll('.node-link').forEach(a => {
        a.classList.toggle('active', a.dataset.path === path);
      });
    }

    refreshAccountBtn();

    (async () => {
      try {
        await loadManifest();
      } catch (e) {
        contentEl.innerHTML = '<p>目录加载失败：' + esc(e.message) + '</p>';
      }
      await loadDoc();
    })();

    // ---------- 复制全文下拉 ----------
    async function writeClipboard(text) {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
      } else {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
    }

    function flashCopied(label) {
      copyBtnText.textContent = label;
      copyBtn.disabled = true;
      setTimeout(() => {
        copyBtnText.textContent = '复制全文';
        copyBtn.disabled = false;
      }, 1500);
    }

    copyBtn.addEventListener('click', e => {
      e.stopPropagation();
      const open = copyMenu.hidden;
      copyMenu.hidden = !open;
      copyBtn.setAttribute('aria-expanded', String(open));
    });

    copyMenu.addEventListener('click', async e => {
      e.stopPropagation();
      const item = e.target.closest('[data-type]');
      if (!item) return;
      const type = item.dataset.type;
      let text = '';
      let label = '已复制';
      if (type === 'markdown') {
        text = rawMarkdown;
        label = 'Markdown 已复制';
      } else if (type === 'xml') {
        text = contentEl.innerHTML;
        label = 'XML 已复制';
      } else {
        text = contentEl.innerText.replace(/\n{3,}/g, '\n\n');
        label = '纯文本已复制';
      }
      try {
        await writeClipboard(text);
        flashCopied(label);
      } catch (err) {
        alert('复制失败，请手动选择内容复制');
      }
      copyMenu.hidden = true;
      copyBtn.setAttribute('aria-expanded', 'false');
    });

    document.addEventListener('click', () => {
      copyMenu.hidden = true;
      copyBtn.setAttribute('aria-expanded', 'false');
    });

    // 移动端抽屉菜单
    document.getElementById('menuBtn').addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('open');
    });
    treeEl.addEventListener('click', e => {
      if (e.target.closest('.node-link')) {
        document.getElementById('sidebar').classList.remove('open');
      }
    });
  </script>
  <script src="license-gate.js"></script>
</body>
</html>
